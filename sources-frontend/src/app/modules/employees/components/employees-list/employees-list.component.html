<p-toast></p-toast>
<p-table [value]="employeeService.employees" [scrollable]="true" scrollHeight="600px">
  <ng-template pTemplate="header">
    <tr>
      <th>ФИО</th>
      <th>Телефон (логин)</th>
      <th>E-mail</th>
      <th>Состояние</th>
      <th>Делегирование</th>
    </tr>
	
      <tr style="background-color: #fff;" *ngIf="globalThis.stateLoadAllEmployes == 'loaded' && employeeService.employees.length == 0">
		<td colspan="5"><span class="nothing_found_text_employes">Сотрудники не найдены</span></td>
      </tr>

      <tr style="background-color: #fff;" *ngIf="globalThis.stateLoadAllEmployes != 'loaded'">
		<td colspan="5"><span class="loading_employes"><span data-pc-section="icon" class="pi pi-spin pi-spinner p-button-icon p-button-icon-left ng-star-inserted"></span>&nbsp;&nbsp;&nbsp;loading ...</span></td>
      </tr>

  </ng-template>
  <ng-template pTemplate="body" let-employee>
    <tr class="cursor-pointer" (click)="updateEmployee(employee)">
      <td>{{employee.fio}}</td>
      <td>{{employee.phone | phoneNumber}}</td>
      <td>{{employee.email}}</td>
      <td>{{employee.is_banned === '1' ? 'Заблокирован' : 'Активен'}}</td>
      <td>{{employee.delegation_fio}}</td>
    </tr>
  </ng-template>
</p-table>
