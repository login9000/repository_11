<p-toast></p-toast>
<p class="gray-text">поля со <span style="color: red">*</span> обязательные для заполнения</p>
<div class="grid">
  <div class="col-8">
    <div><small>Марка и модель транспортного средства<span style="color: red">*</span></small></div>
    <div>
      <input type="text" pInputText [(ngModel)]="transport.brand" [style]="'width: 100%'"/>
    </div>
  </div>
  <div class="col-4">
    <div><small>Госномер<span style="color: red">*</span></small></div>
    <div>
      <input type="text" pInputText [(ngModel)]="transport.license_plate" [style]="'width: 100%'"/>
    </div>
  </div>
  <div class="col-12">
    <div><small>Тип транспортного средства<span style="color: red">*</span></small></div>
    <div>
      <p-dropdown [options]="vehicleTypeOptions"
                  [(ngModel)]="transport.vehicle_type"
                  optionLabel="label"
                  emptyMessage="Нет данных"
                  placeholder="Выберите"
                  [style]="{'width':'100%'}"
                  appendTo="body" ></p-dropdown>
    </div>
  </div>
  <div class="col-12">
    <p-messages [(value)]="messages" [enableService]="false"></p-messages>
  </div>
  <div class="col-3">
    <p-button class="mt-3" [label]="buttonLabel" (click)="onSave()"
              severity="success"></p-button>
  </div>
</div>
