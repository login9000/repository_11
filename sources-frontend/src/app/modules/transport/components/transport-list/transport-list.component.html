<p-toast></p-toast>
<div class="page-title">Транспорт</div>
<div class="mt-3 mb-3">
  <p-button label="Добавить" icon="pi pi-plus" iconPos="left" (click)="openTransportEditorDialog()" severity="primary"></p-button>
</div>
<div class="grid">

	<span class="nothing_found_text_transports" *ngIf="globalThis.stateLoadTransports == 'loaded' && transports.length == 0">Транспорт не найден</span>

	<span class="loading_transports" *ngIf="globalThis.stateLoadTransports != 'loaded'"><span data-pc-section="icon" class="pi pi-spin pi-spinner p-button-icon p-button-icon-left ng-star-inserted"></span>&nbsp;&nbsp;&nbsp;loading ...</span>

  <ng-container *ngFor="let transport of transports">
    <div class="col-4">
      <p-panel (click)="openTransportEditorDialog(transport)">
        <ng-template pTemplate="header">
          <div class="panel-header-container">
            <b>{{transport.brand}}</b>
            <p-confirmPopup></p-confirmPopup>
            <span class="transport-delete-dtn"
                  (click)="delete(transport, $event); $event.stopPropagation()"
                  pTooltip="Удалить ТС"
            >
              <i class="pi pi-times"></i>
            </span>
          </div>
        </ng-template>
        <p>{{transport.license_plate}}</p>
        <p>{{transport.vehicle_type}}</p>
      </p-panel>
    </div>
  </ng-container>
</div>
